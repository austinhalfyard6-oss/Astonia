<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Project Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        .grid-cell {
            position: relative;
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .grid-cell:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .status-indicator {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }
        .status-success {
            background-color: #10b981; /* Green */
        }
        .status-fail {
            background-color: #ef4444; /* Red */
        }
        .connector {
            position: absolute;
            height: 2px;
            background-color: #6b7280;
            z-index: 10;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fefefe;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="container mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold text-gray-800 mb-2">Dynamic Project Grid</h1>
            <p class="text-lg text-gray-500">Visualizing the real-time status of your projects.</p>
        </header>

        <div class="flex flex-col sm:flex-row justify-center space-y-4 sm:space-y-0 sm:space-x-4 mb-8">
            <button id="add-project-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 transform hover:scale-105 shadow-md">
                Add New Project
            </button>
            <button id="add-connection-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 transform hover:scale-105 shadow-md">
                Add New Connection
            </button>
        </div>

        <main id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Project cards will be rendered here by JavaScript -->
        </main>
    </div>

    <!-- Modal for adding a project -->
    <div id="add-project-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 class="text-2xl font-bold mb-4">Add New Project</h2>
            <form id="add-project-form" class="space-y-4">
                <div>
                    <label for="projectName" class="block text-sm font-medium text-gray-700">Project Name</label>
                    <input type="text" id="projectName" name="projectName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="projectDescription" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="projectDescription" name="projectDescription" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></textarea>
                </div>
                <div>
                    <label for="projectStatus" class="block text-sm font-medium text-gray-700">Status</label>
                    <select id="projectStatus" name="projectStatus" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="true">Working</option>
                        <option value="false">Failed</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                    Create Project
                </button>
            </form>
        </div>
    </div>

    <!-- Modal for adding a connection -->
    <div id="add-connection-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 class="text-2xl font-bold mb-4">Add New Connection</h2>
            <form id="add-connection-form" class="space-y-4">
                <div>
                    <label for="fromProject" class="block text-sm font-medium text-gray-700">From Project</label>
                    <select id="fromProject" name="fromProject" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
                <div>
                    <label for="toProject" class="block text-sm font-medium text-gray-700">To Project</label>
                    <select id="toProject" name="toProject" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                    Create Connection
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        // Import Firebase libraries
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables provided by the Canvas environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Firebase Initialization ---
        let app, db, auth;
        let userId = null;
        let projects = [];
        let connections = [];

        // Function to initialize Firebase and authenticate
        async function initializeFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Use the provided auth token if available, otherwise sign in anonymously
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Firebase initialization failed:", error);
            }
        }

        // --- Auth State Listener ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                console.log("User authenticated:", userId);
                setupFirestoreListeners();
            } else {
                console.log("User not authenticated.");
            }
        });

        // --- Firestore Listeners ---
        function setupFirestoreListeners() {
            if (!db || !userId) {
                console.log("Database or user ID not ready. Skipping Firestore listeners.");
                return;
            }

            // Public data path: everyone can read/write to this app's space
            const projectsPath = `/artifacts/${appId}/public/data/projects`;
            const connectionsPath = `/artifacts/${appId}/public/data/connections`;

            // Listen for real-time updates to the projects collection
            onSnapshot(collection(db, projectsPath), (snapshot) => {
                projects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                console.log("Projects updated:", projects);
                renderDashboard();
            }, (error) => {
                console.error("Error fetching projects:", error);
            });

            // Listen for real-time updates to the connections collection
            onSnapshot(collection(db, connectionsPath), (snapshot) => {
                connections = snapshot.docs.map(doc => doc.data());
                console.log("Connections updated:", connections);
                renderDashboard();
            }, (error) => {
                console.error("Error fetching connections:", error);
            });
        }

        // --- UI Logic and Rendering ---
        
        /**
         * Renders all projects and connections.
         */
        function renderDashboard() {
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = ''; // Clear the container first
            
            // Remove old connectors before re-rendering
            document.querySelectorAll('.connector').forEach(conn => conn.remove());

            // Render all project cells
            projects.forEach(project => {
                const cell = renderProjectCell(project);
                gridContainer.appendChild(cell);
            });

            // Populate select menus in modals
            populateProjectSelects();

            // Render all connections after a slight delay to ensure all cells are in the DOM
            setTimeout(() => {
                connections.forEach(conn => {
                    renderConnection(conn);
                });
            }, 100);
        }

        /**
         * Renders a single project cell on the dashboard.
         * @param {Object} project - The project object to render.
         * @returns {HTMLElement} The HTML element for the project cell.
         */
        function renderProjectCell(project) {
            const cell = document.createElement('div');
            cell.id = project.id;
            cell.classList.add('grid-cell');
            const statusClass = project.isWorking ? 'status-success' : 'status-fail';
            
            cell.innerHTML = `
                <div class="status-indicator ${statusClass}"></div>
                <h2 class="text-xl font-bold text-center">${project.name}</h2>
                <p class="text-sm text-gray-500 text-center mt-2">${project.description}</p>
            `;
            return cell;
        }

        /**
         * Renders a connector line between two project cells.
         * @param {Object} connection - The connection object to render.
         */
        function renderConnection(connection) {
            const fromEl = document.getElementById(connection.fromId);
            const toEl = document.getElementById(connection.toId);

            if (!fromEl || !toEl) {
                // This can happen if a connection exists for a project that has been deleted
                return;
            }

            const fromRect = fromEl.getBoundingClientRect();
            const toRect = toEl.getBoundingClientRect();
            
            const fromX = fromRect.left + fromRect.width / 2;
            const fromY = fromRect.top + fromRect.height / 2;
            const toX = toRect.left + toRect.width / 2;
            const toY = toRect.top + toRect.height / 2;

            const dx = toX - fromX;
            const dy = toY - fromY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            const connectorEl = document.createElement('div');
            connectorEl.classList.add('connector');
            connectorEl.style.width = `${distance}px`;
            connectorEl.style.transform = `translate(${fromX}px, ${fromY}px) rotate(${angle}deg)`;
            connectorEl.style.transformOrigin = `0 0`;
            connectorEl.style.position = 'absolute';
            connectorEl.style.left = '0';
            connectorEl.style.top = '0';

            document.body.appendChild(connectorEl);
        }

        // Re-render the dashboard on window resize
        window.addEventListener('resize', () => {
             // Use a debounce for performance
            clearTimeout(window.resizeTimeout);
            window.resizeTimeout = setTimeout(renderDashboard, 250);
        });

        // --- Form and Modal Logic ---
        const addProjectModal = document.getElementById('add-project-modal');
        const addProjectBtn = document.getElementById('add-project-btn');
        const addProjectForm = document.getElementById('add-project-form');
        
        const addConnectionModal = document.getElementById('add-connection-modal');
        const addConnectionBtn = document.getElementById('add-connection-btn');
        const addConnectionForm = document.getElementById('add-connection-form');
        
        // Open modal
        addProjectBtn.onclick = () => {
            addProjectModal.style.display = 'flex';
        }
        addConnectionBtn.onclick = () => {
            addConnectionModal.style.display = 'flex';
        }

        // Close modal
        document.querySelectorAll('.close-button').forEach(btn => {
            btn.onclick = () => {
                addProjectModal.style.display = 'none';
                addConnectionModal.style.display = 'none';
            }
        });
        window.onclick = (event) => {
            if (event.target == addProjectModal) {
                addProjectModal.style.display = 'none';
            } else if (event.target == addConnectionModal) {
                addConnectionModal.style.display = 'none';
            }
        }

        // Populate the project selection menus in the "add connection" modal
        function populateProjectSelects() {
            const fromSelect = document.getElementById('fromProject');
            const toSelect = document.getElementById('toProject');
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';
            
            projects.forEach(project => {
                const fromOption = document.createElement('option');
                fromOption.value = project.id;
                fromOption.textContent = project.name;
                fromSelect.appendChild(fromOption);
                
                const toOption = document.createElement('option');
                toOption.value = project.id;
                toOption.textContent = project.name;
                toSelect.appendChild(toOption);
            });
        }

        // Handle project form submission
        addProjectForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newProject = {
                name: e.target.projectName.value,
                description: e.target.projectDescription.value,
                isWorking: e.target.projectStatus.value === 'true'
            };
            
            try {
                const projectsRef = collection(db, `/artifacts/${appId}/public/data/projects`);
                await addDoc(projectsRef, newProject);
                console.log("New project added to Firestore.");
                addProjectModal.style.display = 'none';
                addProjectForm.reset();
            } catch (error) {
                console.error("Error adding project:", error);
            }
        });

        // Handle connection form submission
        addConnectionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newConnection = {
                fromId: e.target.fromProject.value,
                toId: e.target.toProject.value
            };
            
            try {
                const connectionsRef = collection(db, `/artifacts/${appId}/public/data/connections`);
                await addDoc(connectionsRef, newConnection);
                console.log("New connection added to Firestore.");
                addConnectionModal.style.display = 'none';
                addConnectionForm.reset();
            } catch (error) {
                console.error("Error adding connection:", error);
            }
        });

        // Initialize the app
        initializeFirebase();

    </script>
</body>
</html>
